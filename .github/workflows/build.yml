name: Build pool

on:
  schedule:
    - cron: "17 */2 * * *"   # every two hours, at 17 minutes past
  workflow_dispatch:

permissions:
  contents: write

concurrency: build-pool

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the feeds
        run: python build.py
      - name: Commit the pool if it changed
        run: |
          if [ -n "$(git status --porcelain site/pool.json)" ]; then
            git config user.name "neativerse-bot"
            git config user.email "actions@users.noreply.github.com"
            git add site/pool.json
            git commit -m "Update pool"
            git push
          fi
